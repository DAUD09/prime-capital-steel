# =====================================================
# GitHub Actions — Deploy to GitHub Pages
# =====================================================
# This file runs automatically every time you push
# to the "main" branch. It copies all your HTML, CSS,
# JS and images to GitHub Pages so the site goes live.
# You never need to do anything manually after pushing.
# =====================================================

name: Deploy to GitHub Pages

# WHEN to run this workflow
on:
  push:
    branches:
      - main        # runs on every push to main
  workflow_dispatch:  # also lets you trigger it manually
                      # from the GitHub Actions tab

# WHAT permissions this workflow needs
permissions:
  contents: read      # read your repo files
  pages: write        # write to GitHub Pages
  id-token: write     # needed for the Pages deploy action

# Prevent two deploys running at the same time
concurrency:
  group: pages
  cancel-in-progress: false

# THE JOBS — steps GitHub will run in order
jobs:

  # ── JOB 1: Build ──────────────────────────────────
  # For a plain HTML site there is nothing to compile,
  # so "build" just means: package up the files.
  build:
    runs-on: ubuntu-latest   # use a fresh Linux machine

    steps:

      # Step 1: Download your repo onto the Linux machine
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Tell GitHub Pages we are uploading a
      # static site (no Jekyll, no framework)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Step 3: Bundle all your files into an artifact
      # (a zip GitHub Pages will receive and unpack)
      # "path: '.'" means "everything in the root folder"
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'    # uploads everything: html, css, js, images

  # ── JOB 2: Deploy ─────────────────────────────────
  # Runs only after the build job finishes successfully
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build          # wait for build to finish first

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4